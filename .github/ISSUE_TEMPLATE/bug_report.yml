name: Bug report
description: Report a reproducible problem using synthetic data
body:
  - type: input
    id: environment
    attributes:
      label: App version, browser and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic example
      description: Use invented values. Do not attach a private statement, PIN, OTP, password or account identifier.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
