name: Quality and privacy checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/deployment.test.mjs
      - run: pnpm test:archive-security
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-results
          path: |
            coverage/
            playwright-report/
            test-results/
            .lighthouseci/
            lighthouse-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package the verified static export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'KingEmma7/momo-lens'
        run: node scripts/deployment.mjs prepare
        env:
          DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/production-site
      - name: Preserve the exact production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'KingEmma7/momo-lens'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-site-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'KingEmma7/momo-lens'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: production
      url: https://momo-lens.etagbor.workers.dev
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: deploy-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-site-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-site
      - name: Install the isolated deployment tool without repository hooks
        run: npm install --prefix "$RUNNER_TEMP/wrangler-cli" --no-save --package-lock=false --ignore-scripts wrangler@4.148.0
        env:
          npm_config_cache: ${{ runner.temp }}/wrangler-npm-cache
      - name: Verify current main and merged PR, then publish
        id: publish
        run: node deploy-source/scripts/deployment.mjs publish
        env:
          DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/production-site
          WRANGLER_BIN: ${{ runner.temp }}/wrangler-cli/node_modules/wrangler/bin/wrangler.js
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the live commit, security headers and 404 response
        if: steps.publish.outputs.deployed == 'true'
        run: node deploy-source/scripts/deployment.mjs verify-live
        env:
          DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/production-site
